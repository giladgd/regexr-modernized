name: Website

on:
    push:
        branches: ["**"]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

env:
    HUSKY: "0"

jobs:
    build:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.preview.outputs.version }}
            artifact: website-${{ github.run_id }}-${{ github.run_attempt }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run lint -- --max-warnings 0
            - name: Check conventional commits
              env:
                  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
              run: |
                  first=$(git log "$HEAD_SHA" --diff-filter=A --format=%H -- .husky/commit-msg | tail -1)
                  from="$first^"
                  if git merge-base --is-ancestor "$first" "$BASE_SHA" 2>/dev/null; then
                      from=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
                  fi
                  npm run commitlint -- --from "$from" --to "$HEAD_SHA"
            - run: npm test
            - name: Resolve the next version
              id: preview
              if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
              run: npm run release:version
            - name: Build the release candidate
              if: steps.preview.outputs.version != ''
              env:
                  RELEASE_VERSION: ${{ steps.preview.outputs.version }}
              run: npm run build
            - name: Upload the versioned website
              if: steps.preview.outputs.version != ''
              uses: actions/upload-artifact@v7
              with:
                  name: website-${{ github.run_id }}-${{ github.run_attempt }}
                  path: dist
                  if-no-files-found: error
                  retention-days: 30

    release:
        name: Release v${{ needs.build.outputs.version }} and deploy
        needs: build
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && needs.build.outputs.version != ''
        runs-on: ubuntu-latest
        environment:
            name: website
            url: ${{ steps.deploy.outputs.page_url }}
        concurrency:
            group: website-release
            cancel-in-progress: false
        permissions:
            id-token: write
            contents: write
            issues: write
            pull-requests: write
            discussions: write
            pages: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  package-manager-cache: false
            - run: npm ci
            - name: Download the build
              uses: actions/download-artifact@v8
              with:
                  name: ${{ needs.build.outputs.artifact }}
                  path: dist
            - name: Prepare build
              env:
                  INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
              run: printf '%s' "$INDEXNOW_KEY" > "dist/$INDEXNOW_KEY.txt"
            - name: Upload the Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  name: github-pages-${{ github.run_attempt }}
                  path: dist
            - name: Publish the GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_VERSION: ${{ needs.build.outputs.version }}
              run: npm run release
            - name: Deploy the approved website
              id: deploy
              uses: actions/deploy-pages@v5
              with:
                  artifact_name: github-pages-${{ github.run_attempt }}
            - name: Notify IndexNow
              continue-on-error: true
              env:
                  INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
              run: |
                  curl --fail --silent --show-error --retry 3 --max-time 15 --retry-max-time 60 \
                      --write-out 'IndexNow HTTP %{http_code}\n' --get 'https://api.indexnow.org/indexnow' \
                      --data-urlencode 'url=https://regexr-modernized.giladgd.com/' --data-urlencode "key=$INDEXNOW_KEY" \
                      --data-urlencode "keyLocation=https://regexr-modernized.giladgd.com/$INDEXNOW_KEY.txt"
